<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Agrovet Campo Alto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <!-- Logo o Título -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-green-700">Agrovet Campo Alto</h1>
            <p class="text-gray-500 text-sm mt-2">Sistema de Gestión e Inventario</p>
        </div>

        <!-- Formulario -->
        <form id="form-login" class="space-y-6">
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2">Correo Electrónico</label>
                <input type="email" id="email" required 
                       class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 text-sm" 
                       placeholder="usuario@campoalto.com">
            </div>

            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2">Contraseña</label>
                <input type="password" id="password" required 
                       class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 text-sm" 
                       placeholder="••••••••">
            </div>

            <!-- Contenedor para mensajes de error -->
            <div id="mensaje-error" class="hidden bg-red-100 text-red-700 px-4 py-2 rounded-lg text-sm text-center">
            </div>

            <button type="submit" id="btn-submit"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 px-4 rounded-lg transition duration-200 shadow">
                Iniciar Sesión
            </button>
        </form>
    </div>

    <!-- Cargar la lógica -->
    <script type="module" src="app.js"></script>
</body>
</html>
