<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Agrovet Campo Alto</title>
    
    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '"Inter"', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    },
                    colors: {
                        forest: {
                            950: '#020906',
                            900: '#051810',
                            800: '#0a2c1e',
                            700: '#0f442e',
                            600: '#156142',
                            500: '#10b981',
                            400: '#34d399',
                            300: '#6ee7b7',
                        }
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(8px) scale(0.99)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                        },
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pop-in': 'popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    }
                }
            }
        }
    </script>

    <style>
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(16, 185, 129, 0.14);
        }
    </style>
</head>
<body class="bg-forest-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 antialiased bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-forest-900/40 via-forest-950 to-[#010403] selection:bg-emerald-500 selection:text-white">

    <!-- Ambient background glows -->
    <div class="fixed top-0 left-1/3 w-[500px] h-[500px] bg-emerald-500/10 rounded-full blur-[150px] pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-[400px] h-[400px] bg-amber-500/5 rounded-full blur-[140px] pointer-events-none"></div>

    <div class="glass-panel p-8 sm:p-10 rounded-3xl shadow-2xl w-full max-w-md border border-emerald-500/30 relative z-10 animate-pop-in">
        <!-- Logo / Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-400 to-forest-700 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-emerald-900/50 border border-emerald-300/30">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-extrabold text-white tracking-tight">Agrovet Campo Alto</h1>
            <p class="text-xs font-semibold text-emerald-400 tracking-wider uppercase mt-1">Sistema POS & Gestión Agroveterinaria</p>
        </div>

        <!-- Formulario -->
        <form id="form-login" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1.5">Correo Electrónico</label>
                <input type="email" id="email" required 
                       class="w-full bg-forest-950 border border-slate-700/80 rounded-2xl px-4 py-3 text-white text-sm outline-none focus:border-emerald-500 transition shadow-inner" 
                       placeholder="usuario@campoalto.com">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1.5">Contraseña</label>
                <input type="password" id="password" required 
                       class="w-full bg-forest-950 border border-slate-700/80 rounded-2xl px-4 py-3 text-white text-sm outline-none focus:border-emerald-500 transition shadow-inner" 
                       placeholder="••••••••">
            </div>

            <!-- Contenedor para mensajes de error -->
            <div id="mensaje-error" class="hidden bg-rose-500/15 border border-rose-500/30 text-rose-300 px-4 py-2.5 rounded-2xl text-xs text-center font-semibold">
            </div>

            <button type="submit" id="btn-submit"
                    class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-600 via-emerald-500 to-teal-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-extrabold text-sm shadow-xl shadow-emerald-900/50 transition transform hover:-translate-y-0.5">
                Iniciar Sesión
            </button>
        </form>
    </div>

    <!-- Cargar la lógica -->
    <script type="module" src="app.js"></script>
</body>
</html>
