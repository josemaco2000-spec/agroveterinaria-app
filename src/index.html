<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Agrovet Campo Alto</title>
    
    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '"Inter"', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    },
                    colors: {
                        forest: {
                            950: '#020906',
                            900: '#051810',
                            800: '#0a2c1e',
                            700: '#0f442e',
                            600: '#156142',
                            500: '#10b981',
                            400: '#34d399',
                            300: '#6ee7b7',
                        }
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(8px) scale(0.99)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                        },
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pop-in': 'popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    }
                }
            }
        }
    </script>

    <!-- Theme Controller Script -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        })();

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeToggleButtons();
        }

        function updateThemeToggleButtons() {
            const isDark = document.documentElement.classList.contains('dark');
            document.querySelectorAll('#theme-toggle-knob').forEach(knob => {
                knob.style.transform = isDark ? 'translateX(0px)' : 'translateX(20px)';
            });
            document.querySelectorAll('#theme-toggle-icon').forEach(icon => {
                icon.textContent = isDark ? '🌙' : '☀️';
            });
            document.querySelectorAll('#theme-toggle-label').forEach(label => {
                label.textContent = isDark ? 'Modo Oscuro' : 'Modo Claro';
            });
        }

        document.addEventListener('DOMContentLoaded', updateThemeToggleButtons);
    </script>

    <style>
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(16, 185, 129, 0.14);
        }

        /* Glassmorphism Light Mode (Ultra-Premium Emerald Crystal) */
        html:not(.dark) body {
            background-color: #f8fafc;
            background-image: radial-gradient(ellipse at top, rgba(16, 185, 129, 0.12), rgba(241, 245, 249, 1) 75%);
            color: #0f172a;
        }

        html:not(.dark) .glass-panel {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(16, 185, 129, 0.22);
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.05), 0 0 20px 0 rgba(16, 185, 129, 0.06);
        }

        html:not(.dark) input:not([type="checkbox"]), 
        html:not(.dark) select, 
        html:not(.dark) textarea {
            background-color: rgba(255, 255, 255, 0.95) !important;
            color: #0f172a !important;
            border-color: rgba(203, 213, 225, 0.9) !important;
        }

        html:not(.dark) input::placeholder, 
        html:not(.dark) textarea::placeholder {
            color: #94a3b8 !important;
        }

        html:not(.dark) .text-slate-300, 
        html:not(.dark) .text-slate-400 {
            color: #475569 !important;
        }

        html:not(.dark) .bg-forest-950 {
            background-color: rgba(241, 245, 249, 0.9) !important;
        }
    </style>
</head>
<body class="bg-forest-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 antialiased bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-forest-900/40 via-forest-950 to-[#010403] selection:bg-emerald-500 selection:text-white">

    <!-- Ambient background glows -->
    <div class="fixed top-0 left-1/3 w-[500px] h-[500px] bg-emerald-500/10 rounded-full blur-[150px] pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-[400px] h-[400px] bg-amber-500/5 rounded-full blur-[140px] pointer-events-none"></div>

    <div class="glass-panel p-8 sm:p-10 rounded-3xl shadow-2xl w-full max-w-md border border-emerald-500/30 relative z-10 animate-pop-in">
        <!-- Minimalist Sliding Theme Switcher -->
        <div class="flex justify-end mb-2">
            <button type="button" onclick="toggleTheme()" 
                    title="Cambiar Tema"
                    class="flex items-center px-2.5 py-1.5 rounded-full glass-card border border-emerald-500/20 hover:border-emerald-400/50 hover:shadow-[0_0_15px_rgba(16,185,129,0.25)] transition-all duration-300 group/theme cursor-pointer">
                <div class="flex items-center gap-2">
                    <div class="relative w-11 h-6 rounded-full bg-forest-950/80 border border-emerald-500/30 p-0.5 transition-colors duration-300 shadow-inner flex items-center shrink-0">
                        <div id="theme-toggle-knob" class="w-5 h-5 rounded-full bg-gradient-to-tr from-emerald-500 to-emerald-400 text-forest-950 font-bold text-[10px] flex items-center justify-center shadow-md transform transition-transform duration-300">
                            <span id="theme-toggle-icon">🌙</span>
                        </div>
                    </div>
                    <span class="text-xs font-semibold text-slate-300">
                        <span id="theme-toggle-label">Modo Oscuro</span>
                    </span>
                </div>
            </button>
        </div>

        <!-- Logo / Header -->
        <div class="text-center mb-8">
            <div class="w-20 h-20 rounded-3xl bg-forest-950/80 p-2 flex items-center justify-center mx-auto mb-4 shadow-xl shadow-emerald-900/50 border border-emerald-400/30 overflow-hidden">
                <img src="./assets/logo-campo-alto.png" alt="Logo Campo Alto" class="h-16 w-auto object-contain">
            </div>
            <h1 class="text-2xl font-extrabold text-white tracking-tight">Agrovet Campo Alto</h1>
            <p class="text-xs font-semibold text-emerald-400 tracking-wider uppercase mt-1">Sistema POS & Gestión Agroveterinaria</p>
        </div>

        <!-- Formulario -->
        <form id="form-login" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1.5">Correo Electrónico</label>
                <input type="email" id="email" required 
                       class="w-full bg-forest-950 border border-slate-700/80 rounded-2xl px-4 py-3 text-white text-sm outline-none focus:border-emerald-500 transition shadow-inner" 
                       placeholder="usuario@campoalto.com">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1.5">Contraseña</label>
                <input type="password" id="password" required 
                       class="w-full bg-forest-950 border border-slate-700/80 rounded-2xl px-4 py-3 text-white text-sm outline-none focus:border-emerald-500 transition shadow-inner" 
                       placeholder="••••••••">
            </div>

            <!-- Contenedor para mensajes de error -->
            <div id="mensaje-error" class="hidden bg-rose-500/15 border border-rose-500/30 text-rose-300 px-4 py-2.5 rounded-2xl text-xs text-center font-semibold">
            </div>

            <button type="submit" id="btn-submit"
                    class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-600 via-emerald-500 to-teal-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-extrabold text-sm shadow-xl shadow-emerald-900/50 transition transform hover:-translate-y-0.5">
                Iniciar Sesión
            </button>
        </form>
    </div>

    <!-- Cargar la lógica -->
    <script type="module" src="app.js"></script>
</body>
</html>
