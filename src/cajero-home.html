<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agroservicio Campo Alto - Terminal de Caja</title>

    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-emerald-50 via-teal-50 to-green-100 min-h-screen text-slate-800 font-sans antialiased flex flex-col justify-between selection:bg-emerald-200">

    <!-- Header Minimalista -->
    <header class="bg-white/80 backdrop-blur-md border-b border-emerald-100/80 sticky top-0 z-30 px-6 py-4 shadow-sm">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-emerald-600 flex items-center justify-center text-white text-xl font-black shadow-md shadow-emerald-600/20">
                    ⚡
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-slate-900 tracking-tight leading-none">Agroservicio Campo Alto</h1>
                    <p class="text-xs font-semibold text-emerald-700 tracking-wide uppercase mt-0.5">Terminal de Caja</p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-emerald-100/70 border border-emerald-200 px-4 py-2 rounded-full">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="cajero-email" class="text-sm font-bold text-emerald-900">Cargando...</span>
                </div>

                <button id="btn-logout" class="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 px-4 py-2 rounded-full font-bold text-sm transition-all duration-150 active:scale-95 flex items-center gap-2 shadow-sm">
                    <span>🚪</span>
                    <span>Cerrar Sesión</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Grid Dashboard -->
    <main class="flex-1 flex flex-col justify-center items-center px-4 py-8 max-w-4xl mx-auto w-full">
        <div class="text-center mb-8">
            <h2 class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight">Panel de Operaciones</h2>
            <p class="text-slate-600 font-medium mt-2 text-base md:text-lg">Selecciona una tarea para comenzar rápidamente</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl mx-auto w-full">
            <!-- Card 1: Nueva Venta (Routes to cajero-pos.html) -->
            <button id="card-nueva-venta" class="group bg-gradient-to-br from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 text-white rounded-3xl p-8 sm:p-10 shadow-xl hover:shadow-2xl hover:shadow-emerald-600/30 hover:-translate-y-1.5 active:translate-y-0 active:scale-98 transition-all duration-200 flex flex-col items-center justify-center text-center border-4 border-emerald-400/40 relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
                <span class="text-7xl md:text-8xl mb-4 transform group-hover:scale-110 transition-transform duration-200">🛒</span>
                <span class="text-3xl md:text-4xl font-extrabold tracking-tight">Nueva Venta</span>
                <span class="text-emerald-100 font-semibold text-lg mt-2">Ir al Punto de Venta (POS)</span>
            </button>

            <!-- Card 2: Buscar Cliente -->
            <button id="card-buscar-cliente" class="group bg-gradient-to-br from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white rounded-3xl p-8 sm:p-10 shadow-xl hover:shadow-2xl hover:shadow-blue-600/30 hover:-translate-y-1.5 active:translate-y-0 active:scale-98 transition-all duration-200 flex flex-col items-center justify-center text-center border-4 border-blue-400/40 relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
                <span class="text-7xl md:text-8xl mb-4 transform group-hover:scale-110 transition-transform duration-200">👥</span>
                <span class="text-3xl md:text-4xl font-extrabold tracking-tight">Buscar Cliente</span>
                <span class="text-blue-100 font-semibold text-lg mt-2">Directorio de Clientes</span>
            </button>

            <!-- Card 3: Consultar Precio -->
            <button id="card-consultar-precio" class="group bg-gradient-to-br from-slate-700 to-slate-800 hover:from-slate-800 hover:to-slate-900 text-white rounded-3xl p-8 sm:p-10 shadow-xl hover:shadow-2xl hover:shadow-slate-800/30 hover:-translate-y-1.5 active:translate-y-0 active:scale-98 transition-all duration-200 flex flex-col items-center justify-center text-center border-4 border-slate-600/40 relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
                <span class="text-7xl md:text-8xl mb-4 transform group-hover:scale-110 transition-transform duration-200">📦</span>
                <span class="text-3xl md:text-4xl font-extrabold tracking-tight">Consultar Precio</span>
                <span class="text-slate-300 font-semibold text-lg mt-2">Buscador Rápido</span>
            </button>

            <!-- Card 4: Cierre de Caja -->
            <button id="card-cierre-caja" class="group bg-gradient-to-br from-rose-500 to-red-600 hover:from-rose-600 hover:to-red-700 text-white rounded-3xl p-8 sm:p-10 shadow-xl hover:shadow-2xl hover:shadow-rose-600/30 hover:-translate-y-1.5 active:translate-y-0 active:scale-98 transition-all duration-200 flex flex-col items-center justify-center text-center border-4 border-rose-400/40 relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
                <span class="text-7xl md:text-8xl mb-4 transform group-hover:scale-110 transition-transform duration-200">🔒</span>
                <span class="text-3xl md:text-4xl font-extrabold tracking-tight">Cierre de Caja</span>
                <span class="text-rose-100 font-semibold text-lg mt-2">Arqueo y Corte Diario</span>
            </button>
        </div>
    </main>

    <!-- Footer Discreto -->
    <footer class="py-4 text-center text-xs font-semibold text-slate-400">
        Agroservicio Campo Alto &copy; 2026 - Terminal Vendedor
    </footer>

    <!-- Modal Consultar Precio (Sin stock, sin carrito, solo Precio Venta y Presentación) -->
    <div id="modal-precio" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-white rounded-3xl shadow-2xl max-w-3xl w-full p-6 md:p-8 flex flex-col max-h-[85vh] border border-slate-100 transform scale-95 transition-transform duration-200" id="modal-precio-box">
            <!-- Modal Header -->
            <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-4">
                <div class="flex items-center gap-3">
                    <span class="text-3xl">📦</span>
                    <div>
                        <h3 class="text-2xl font-extrabold text-slate-900">Consulta Rápida de Precios</h3>
                        <p class="text-xs text-slate-500 font-medium">Buscador directo de precios al público</p>
                    </div>
                </div>
                <button id="btn-cerrar-modal-precio" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold text-sm transition flex items-center gap-1.5 shadow-sm">
                    <span>✕</span>
                    <span>Cerrar</span>
                </button>
            </div>

            <!-- Modal Search Input -->
            <div class="relative mb-6">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-2xl text-slate-400">🔍</span>
                <input id="search-precio" type="text" placeholder="Escribe producto, presentación o código de barras..." class="w-full text-lg md:text-xl py-4 pl-14 pr-4 rounded-2xl border-2 border-slate-200 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100 outline-none font-bold text-slate-800 placeholder-slate-400 transition shadow-inner">
            </div>

            <!-- Modal Results Grid -->
            <div id="resultados-precio" class="flex-1 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 gap-4 pr-1 min-h-[250px]">
                <div class="col-span-full text-center py-12 text-slate-400 font-medium">
                    Escribe para consultar precios...
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Funcionalidad -->
    <script type="module" src="cajero-home.js"></script>
</body>
</html>
